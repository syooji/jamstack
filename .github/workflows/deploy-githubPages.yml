name: GitHub Pagesへのデプロイ

on:
  # main または master ブランチへのプッシュで自動実行
  push:
    branches: [main, master]
  # GitHubの画面から手動実行も可能にする
  workflow_dispatch:
  # microCMSなどの外部Webhookからの通知を受け取って自動実行
  repository_dispatch:

# GitHub Pagesへのデプロイに必要な権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重複しないように直列化
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci

      - name: Astroサイトのビルド
        env:
          # microCMSの認証情報をGitHubのSecretsから注入
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run build

      - name: ビルド成果物のアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pagesへのデプロイ実行
        id: deployment
        uses: actions/deploy-pages@v4
